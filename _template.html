<!DOCTYPE html>
<html lang="en">
<head>
    <script>if(!location.pathname.endsWith('/')&&!location.pathname.endsWith('.html')){location.replace(location.pathname+'/'+location.search+location.hash);}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game: COSYlanguages</title>
    <link rel="icon" href="https://cosylanguages.github.io/COSYlanguages/images/logos/cosylanguages.png">

    <link rel="stylesheet" href="../shared/css/cosy-tokens.css">
    <link rel="stylesheet" href="../shared/css/tokens.css">
    <link rel="stylesheet" href="../shared/css/games.css">
    <link rel="stylesheet" href="../shared/css/nav.css">
    <link rel="stylesheet" href="../shared/styles/game-styles.css">
    <link rel="stylesheet" href="../_engine/components.css">

</head>
<body class="game-standalone cosy-game-theme">
    <nav class="cg-nav">
  <a href="../index.html" class="cg-nav-brand">🎮 COSY Games</a>
  <div class="cg-nav-right">
    <a href="https://cosylanguages.github.io/COSYlanguages/" class="cg-nav-hub-link" target="_blank" rel="noopener">Home 🏠</a>
    <select id="cosy-ui-lang-switcher" class="cosy-lang-select" onchange="if(window.setLanguage)window.setLanguage(this.value)" aria-label="Interface Language">
                <option value="en">🇬🇧 EN</option>
                <option value="fr">🇫🇷 FR</option>
                <option value="it">🇮🇹 IT</option>
                <option value="ru">🇷🇺 RU</option>
                <option value="el">🇬🇷 EL</option>
            </select>
            <button class="cg-theme-btn" onclick="toggleCosyGamesTheme()" aria-label="Toggle dark mode">🌓</button>
  </div>
</nav>

    <div class="game-overlay open game-overlay-standalone" id="game-overlay">
      <div class="go-topbar">
        <button class="go-back cg-btn cg-btn-secondary" onclick="location.href='../index.html'" data-i18n="back_to_games" data-i18n="back_to_games">← Back to Games</button>
        <div>
          <div class="go-title" id="go-title">Game</div>
          <div class="go-meta" id="go-meta"></div>
        </div>
        <div id="go-topbar-right"></div>
      </div>
      <div class="go-body" id="go-body">
          <div id="game-loader" class="game-loader">Loading game assets...</div>
      </div>
    </div>

    <!-- Footer -->
    <footer class="cg-footer">
        <div class="cg-footer-inner">
            <div class="cg-footer-brand">
                <img src="https://cosylanguages.github.io/COSYlanguages/images/logos/cosylanguages.png" alt="COSYlanguages logo" style="width: 24px; height: 24px;" onerror="this.style.display='none'">
                <span>COSYlanguages</span>
            </div>
            <p class="cg-footer-desc">Your friendly corner to master new languages and connect with the world. 🌍</p>
            <div class="cg-footer-links">
                <a href="https://cosylanguages.github.io/COSYlanguages/" target="_blank" rel="noopener">COSYlanguages Home</a>
                <a href="../index.html">Games Hub</a>
                <a href="https://cosylanguages.github.io/COSYtools/" target="_blank" rel="noopener">COSYtools</a>
                <a href="https://github.com/cosylanguages/COSYgames" target="_blank" rel="noopener">GitHub Repository</a>
            </div>
            <div class="cg-footer-copy">© 2026 COSYlanguages: All rights reserved</div>
        </div>
    </footer>

    <!-- Game Engine -->
    <script src="../_engine/view_context.js"></script>
    <script src="../_engine/game_session.js"></script>
    <script src="../_engine/scores.js"></script>
    <script src="../_engine/loader.js"></script>

    <!-- Game Specific Logic (loaded by individual folders) -->
    <script src="game.js"></script>

    <div id="toast" class="toast-notification"></div>
    <script src="shared/js/i18n.js"></script>
    <script src="../shared/js/nav.js"></script>
</body>
</html>
