name: Validate COSYdata Sync & Datasets

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run COSYdata Alignment Audit Check
        run: node scripts/sync-from-cosydata.js --check

      - name: Run Engine & Etymology Test Suite
        run: node --test tests/*.js
